services:
  - type: web
    name: svl-sms-frontend
    runtime: static
    region: oregon
    plan: standard
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    staticPublishPath: dist
    routes:
      - path: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://svl-sms-backend.onrender.com/api
