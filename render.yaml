services:
  - type: web
    name: svl-sms-backend
    runtime: node
    region: oregon
    plan: standard
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        # Pin to Node 24: better-sqlite3@13 ships prebuilt binaries for the
        # Node 24 ABI. On Node 20 the module segfaults at startup.
        value: 24
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: ./data/svl-sms.db
      - key: JWT_SECRET
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://svl-sms.vercel.app,https://svl-sms-frontend.vercel.app
      - key: FRONTEND_URL
        value: https://svl-sms.vercel.app
    healthCheckPath: /api/health
    disk:
      name: svl-sms-data
      mountPath: /opt/render/project/src/data
      sizeGB: 2

  - type: web
    name: svl-sms-frontend
    runtime: static
    region: oregon
    plan: standard
    buildCommand: cd frontend && npm install --include=dev --legacy-peer-deps && npm run build
    staticPublishPath: frontend/dist
    routes:
      - path: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://svl-sms-backend.onrender.com/api
