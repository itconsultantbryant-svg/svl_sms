name: Build macOS Offline Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos-installer:
    name: macOS DMG + ZIP
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # macOS code signing + notarization secrets (set in GitHub repository Settings → Secrets)
      # CSC_NAME: "Developer ID Application: Your Name (TEAM_ID)"  — from Apple Developer portal
      # APPLE_ID: your Apple ID email
      # APPLE_ID_PASS: app-specific password (from appleid.apple.com)
      # APPLE_TEAM_ID: your Team ID (10 chars, e.g. ABCD1234EF)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Build macOS DMG + ZIP (sign + notarize if secrets present)
        run: npm run electron-build:mac
        env:
          # These are used by electron-builder.yml when present
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASS: ${{ secrets.APPLE_ID_PASS }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SVL-SMS-macOS-Installer
          path: |
            out/SVL-SMS-*.dmg
            out/SVL-SMS-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/SVL-SMS-*.dmg
            out/SVL-SMS-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}