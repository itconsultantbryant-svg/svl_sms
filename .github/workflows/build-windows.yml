name: Build Windows Offline Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows Setup ZIP
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Build Windows NSIS installer and ZIP
        run: npm run electron-build:win:zip
        env:
          # Skip code signing for unsigned school offline builds
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SVL-SMS-Windows-Installer
          path: |
            out/SVL-SMS-*-Windows.zip
            out/SVL-SMS-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/SVL-SMS-*-Windows.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
