appId: com.svl-sms.desktop
productName: SVL-SMS
directories:
  buildResources: assets
  output: out
files:
  - dist/electron/**/*
  - dist/frontend/**/*
  - dist/backend/**/*
  - package.json
  - node_modules/**/*
  - '!node_modules/typescript'
  - '!node_modules/@types'
  - '!**/node_modules/*/test'
  - '!**/node_modules/*/tests'
  - '!**/node_modules/*/docs'
  - '!**/node_modules/*/examples'

# Windows configuration
win:
  target:
    - nsis
    - portable
    - msi
  certificateFile: null
  certificatePassword: null
  signingHashAlgorithms:
    - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SVL-SMS

msi:
  oneClick: false

portable:
  artifactName: ${productName}-${version}.exe

# macOS configuration
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  certificateFile: null
  certificatePassword: null
  identity: null
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist

dmg:
  title: Install ${productName}
  window:
    x: 100
    y: 100
    width: 512
    height: 384
  contents:
    - x: 256
      y: 130
      type: file
    - x: 256
      y: 250
      type: link
      path: /Applications

# Linux configuration
linux:
  target:
    - AppImage
    - snap
  category: Office
  desktop:
    Name: SVL-SMS
    Comment: School Management System
    Categories: Office;Education;Database;

appImage:
  artifactName: ${productName}-${version}.AppImage

snap:
  publish:
    provider: github

# Publishing configuration
publish:
  provider: github
  owner: svl-sms
  repo: desktop
  releaseType: release
  vPrefixedTagName: true

# Auto-update configuration
update:
  provider: github
  owner: svl-sms
  repo: desktop
  releaseType: release
