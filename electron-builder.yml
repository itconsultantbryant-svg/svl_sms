appId: com.svl-sms.desktop
productName: SVL-SMS
copyright: Copyright © SVL-SMS Team

directories:
  buildResources: assets
  output: out

files:
  - dist/electron/**/*
  - dist/frontend/**/*
  - dist/backend/**/*
  - package.json
  - node_modules/**/*
  - '!node_modules/typescript{,/**/*}'
  - '!node_modules/@types{,/**/*}'
  - '!node_modules/electron{,/**/*}'
  - '!node_modules/electron-builder{,/**/*}'
  - '!node_modules/archiver{,/**/*}'
  - '!node_modules/**/{test,tests,docs,examples,example}{,/**/*}'
  - '!node_modules/**/*.md'
  - '!node_modules/**/CHANGELOG*'

extraMetadata:
  main: dist/electron/main.js

asar: true
# Only unpack native binaries. Keep JS (backend + node_modules) inside asar
# so require('express') etc. resolve correctly when spawned with ELECTRON_RUN_AS_NODE.
asarUnpack:
  - '**/*.node'

# Windows — classic Setup.exe installer (zipped after build for distribution)
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: SVL-SMS-Setup-${version}.${ext}
  # Unsigned builds still produce a working installer (SmartScreen may warn)

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SVL-SMS
  installerLanguages:
    - English
  deleteAppDataOnUninstall: false
  artifactName: SVL-SMS-Setup-${version}.${ext}

mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist

dmg:
  title: Install ${productName}

linux:
  target:
    - AppImage
  category: Office
  artifactName: ${productName}-${version}.${ext}

publish:
  provider: github
  owner: itconsultantbryant-svg
  repo: svl_sms
  releaseType: release
  vPrefixedTagName: true
