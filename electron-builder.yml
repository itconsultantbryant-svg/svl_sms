appId: com.svl-sms.desktop
productName: SVL-SMS
copyright: Copyright © SVL-SMS Team

directories:
  buildResources: assets
  output: out

files:
  - dist/electron/**/*
  - dist/frontend/**/*
  - dist/backend/**/*
  - package.json
  - node_modules/**/*
  - '!node_modules/typescript{,/**/*}'
  - '!node_modules/@types{,/**/*}'
  - '!node_modules/electron{,/**/*}'
  - '!node_modules/electron-builder{,/**/*}'
  - '!node_modules/archiver{,/**/*}'
  - '!node_modules/concurrently{,/**/*}'
  - '!node_modules/wait-on{,/**/*}'
  - '!node_modules/**/{test,tests,docs,examples,example}{,/**/*}'
  - '!node_modules/**/*.md'
  - '!node_modules/**/CHANGELOG*'

extraMetadata:
  main: dist/electron/main.js

asar: true
# Backend must run as a real child process (cannot spawn paths inside app.asar).
# Unpack backend + node_modules onto disk so require('express') works.
asarUnpack:
  - dist/backend/**/*
  - node_modules/**/*

# Windows — classic Setup.exe installer (zipped after build for distribution)
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: SVL-SMS-Setup-${version}.${ext}
  # Code signing (optional but required for distribution without SmartScreen warnings).
  # Set CSC_LINK (base64-encoded .pfx or path) and CSC_KEY_PASSWORD in CI secrets.
  # If not set, electron-builder skips signing and produces an unsigned installer.
  # Using env var substitution that falls back to empty string if not set.
  certificateFile: ${env.CSC_LINK}
  certificatePassword: ${env.CSC_KEY_PASSWORD}
  publisherName: ${env.CSC_NAME}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SVL-SMS
  installerLanguages:
    - en_US
  deleteAppDataOnUninstall: false
  artifactName: SVL-SMS-Setup-${version}.${ext}

mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  # Code signing + notarization (optional but required for Gatekeeper approval).
  # Set APPLE_ID, APPLE_ID_PASS (app-specific password), and APPLE_TEAM_ID in CI secrets.
  # If not set, electron-builder skips signing/notarization.
  identity: ${env.CSC_NAME}  # "Developer ID Application: Your Name (TEAM_ID)"
  hardenedRuntime: true
  gatekeeperAssess: true

dmg:
  title: Install ${productName}

linux:
  target:
    - AppImage
  category: Office
  artifactName: ${productName}-${version}.${ext}

publish:
  provider: github
  owner: itconsultantbryant-svg
  repo: svl_sms
  releaseType: release
  vPrefixedTagName: true
